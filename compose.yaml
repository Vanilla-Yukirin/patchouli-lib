services:
  api:
    image: ${PATCHOULI_IMAGE:-patchouli-lib:local}
    build:
      context: .
    restart: unless-stopped
    environment:
      PATCHOULI_DATABASE_URL: sqlite:////data/patchouli.db
      PATCHOULI_ENVIRONMENT: ${PATCHOULI_ENVIRONMENT:-development}
      PATCHOULI_LOG_LEVEL: ${PATCHOULI_LOG_LEVEL:-info}
      PATCHOULI_RETRIEVAL_CURSOR_SIGNING_SECRET: ${PATCHOULI_RETRIEVAL_CURSOR_SIGNING_SECRET:?required}
    ports:
      - 127.0.0.1:${PATCHOULI_PORT:-8765}:8000
    volumes:
      - patchouli-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  patchouli-data:
