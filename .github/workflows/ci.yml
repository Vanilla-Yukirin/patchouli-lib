name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install documentation tooling
        run: npm ci

      - name: Lint public Markdown
        run: npm run lint:docs

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.11
          python-version: "3.13"
          enable-cache: true

      - name: Validate source, tests, and migrations
        run: uv run python scripts/validate.py --skip-docs

  client-python:
    name: Python client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.11
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock

      - name: Install locked client dependencies
        run: uv sync --frozen --all-groups

      - name: Check client formatting
        run: uv run --frozen ruff format --check .

      - name: Lint client
        run: uv run --frozen ruff check .

      - name: Type-check client
        run: uv run --frozen mypy

      - name: Test client with coverage gate
        run: uv run --frozen pytest

      - name: Build client distributions
        run: uv build

      - name: Verify distribution license metadata
        run: uv run --frozen python scripts/verify_artifacts.py

      - name: Verify MCP package and console metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              entry_name = next(
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              )
              metadata = archive.read(metadata_name).decode("utf-8")
              entries = archive.read(entry_name).decode("utf-8")
          assert "patchouli_mcp/server.py" in names
          assert "patchouli-mcp = patchouli_mcp.entrypoint:entrypoint" in entries
          assert "Provides-Extra: mcp" in metadata
          assert "Requires-Dist: mcp<2,>=1.29; extra == 'mcp'" in metadata
          PY

  client-python-windows-safety:
    name: Python client Windows safety
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.11
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock

      - name: Install locked client dependencies
        run: uv sync --frozen --all-groups

      - name: Test Windows filesystem and MCP stdio safety
        run: >-
          uv run --frozen pytest --no-cov
          tests/cli/test_secure_fs.py tests/mcp

  container:
    name: Container
    needs:
      - python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke-test the image
        run: python scripts/container_smoke.py

  publish:
    name: Publish image
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    needs:
      - docs
      - python
      - client-python
      - client-python-windows-safety
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image repository
        id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Private deployment
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.PRIVATE_DEPLOY_ENABLED == 'true'
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: private-deployment
    steps:
      - name: Configure restricted SSH identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy exact image digest
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$IMAGE"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release from the verified tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
