name: 功能请求
description: 提议一项范围明确、面向用户的能力。
title: "功能："
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 请在不包含私有数据的前提下说明用户、目标和当前限制。
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 请描述可观察的行为，而不是偏好的实现方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: milestone
    attributes:
      label: 路线图领域
      options:
        - 持久核心
        - Agent 访问
        - 检索
        - 派生知识
        - 文档与社区
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私核对
      options:
        - label: 我只使用了合成示例或明确公开的示例。
          required: true
