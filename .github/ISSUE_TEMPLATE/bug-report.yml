name: 错误报告
description: 报告受支持制品中可复现的缺陷。
title: "错误："
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你的报告。请用合成示例替换所有真实私有数据。

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 请指出受影响的版本、提交或文档。
      placeholder: 提交 SHA 或文档路径
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 发生了什么，造成了什么影响？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请使用合成数据提供最短的可复现步骤。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 补充证据
      description: 可以附上经过清理的日志或截图，请勿包含机密或私有文档。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私核对
      options:
        - label: 我已移除凭据、私有内容、个人标识和部署细节。
          required: true
