name: Bug report
description: Report a reproducible defect in a supported artifact.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Replace all real private data with synthetic examples.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the affected release, commit, or document.
      placeholder: Commit SHA or document path
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what impact did it have?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence using synthetic data.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs or screenshots. Do not include secrets or private documents.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private content, personal identifiers, and deployment details.
          required: true
