[project]
name = "patchouli-client"
version = "0.1.0a0"
description = "Typed Python wire client for PatchouliLib Agent integrations."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
secret-store = [
  "keyring>=25,<26",
]
mcp = [
  "jsonschema>=4.26,<5",
  "mcp>=1.29,<2",
]

[project.scripts]
patchouli = "patchouli_cli.main:entrypoint"
patchouli-mcp = "patchouli_mcp.entrypoint:entrypoint"

[dependency-groups]
dev = [
  "hatchling>=1.27,<2",
  "jsonschema>=4.26,<5",
  "mcp>=1.29,<2",
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.venv*", "/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/patchouli_client", "src/patchouli_cli", "src/patchouli_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=patchouli_client",
  "--cov=patchouli_cli",
  "--cov=patchouli_mcp",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[tool.coverage.run]
branch = true
source = ["patchouli_client", "patchouli_cli", "patchouli_mcp"]
omit = [
  "src/patchouli_cli/__main__.py",
  "src/patchouli_mcp/__main__.py",
  "src/patchouli_cli/_posix_fs.py",
  "src/patchouli_cli/_windows_fs.py",
]
